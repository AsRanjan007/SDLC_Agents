[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-agents"
version = "0.1.0"
description = "DevCycle AI — an offline, edge-ready multi-agent SDLC workbench (Architect, Developer, Validation Engineer) with a Streamlit UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Ranjan" }]
dependencies = [
    "streamlit>=1.32",
    "openpyxl>=3.1",
    "pytest>=7.4",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.70"]
audio = ["pyttsx3>=2.90"]
security = ["cryptography>=42.0"]
full = ["llama-cpp-python>=0.2.70", "pyttsx3>=2.90", "cryptography>=42.0"]

[project.scripts]
sdlc-agents = "sdlc_agents.cli:main"

[tool.setuptools]
packages = [
    "sdlc_agents",
    "sdlc_agents.llm",
    "sdlc_agents.agents",
    "sdlc_agents.artifacts",
    "sdlc_agents.audio",
    "sdlc_agents.security",
    "sdlc_agents.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
